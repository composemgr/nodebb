# nginx proxy address - http://172.17.0.1:64274

name: nodebb
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: nodebb/nodebb:latest
    container_name: nodebb-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: nodebb-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      # Database connection
      url: https://${BASE_HOST_NAME:-$HOSTNAME}
      DATABASE: mongo
      DB_HOST: nodebb-db
      DB_PORT: 27017
      DB_NAME: ${DB_CREATE_DATABASE_NAME:-nodebb}
      DB_USER: ${DB_USER_NAME:-nodebb}
      DB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      REDIS_HOST: nodebb-redis
      REDIS_PORT: 6379
    ports:
      - '172.17.0.1:64274:4567'
    volumes:
      - './volumes/data/nodebb:/usr/src/nodebb/data:z'
      - './volumes/config/nodebb:/usr/src/nodebb/config:z'
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - nodebb

  db:
    image: mongo:latest
    container_name: nodebb-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: nodebb-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: nodebb-db
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER_NAME:-nodebb}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MONGO_INITDB_DATABASE: ${DB_CREATE_DATABASE_NAME:-nodebb}
    volumes:
      - './volumes/data/db/mongo/nodebb:/data/db:z'
    networks:
      - nodebb

  redis:
    image: redis:alpine
    container_name: nodebb-redis
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: nodebb-redis
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: nodebb-redis
    volumes:
      - './volumes/data/cache/redis/nodebb:/data:z'
    networks:
      - nodebb

networks:
  nodebb:
    name: nodebb
    external: false
