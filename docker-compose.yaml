# nginx proxy address - http://172.17.0.1:64274

name: nodebb
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/nodebb/nodebb:4.16
    container_name: nodebb-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    user: '0:0'
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: nodebb-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/4567']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64274:4567'
    volumes:
      - './volumes/data/nodebb/build:/usr/src/app/build:z'
      - './volumes/data/nodebb/uploads:/usr/src/app/public/uploads:z'
      - './volumes/config/nodebb:/opt/config:z'
    depends_on:
      db:
        condition: service_started
    networks:
      - nodebb

  db:
    image: mongo:latest
    container_name: nodebb-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: nodebb-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: nodebb-db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand(''ping'').ok']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/db/mongo/nodebb:/data/db:z'
    networks:
      - nodebb


networks:
  nodebb:
    name: nodebb
    external: false
